<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasarım Konsepti 3 — Financial Radial Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --cyan: #06b6d4;
      --text: #c9d1d9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; }
    .header { margin-bottom: 24px; border-bottom: 1fr solid var(--border); }
    .title { font-size: 24px; font-weight: 700; color: #f0f6fc; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .val { font-size: 24px; font-weight: 700; color: var(--cyan); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">AKGÜN Financial Radial Hub — Concept 3 (Modern Compact)</h1>
    <p style="color: #8b949e;">Veri yoğunluğu yüksek, kompakt analitik tasarlanmış görünüm</p>
  </div>
  <div class="grid">
    <div class="card">
      <div>Kalan Borç Bakiyesi</div>
      <div class="val">₺124.348.289</div>
    </div>
    <div class="card">
      <div>Ortalama Vade</div>
      <div class="val" style="color: #10b981;">24 Gün</div>
    </div>
    <div class="card">
      <div>Toplam Çek / Senet Riski</div>
      <div class="val" style="color: #f59e0b;">₺20.791.707</div>
    </div>
    <div class="card">
      <div>Tahsilat Başarısı</div>
      <div class="val" style="color: #8b5cf6;">%286,0</div>
    </div>
  </div>
</body>
</html>
