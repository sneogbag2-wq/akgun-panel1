<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radikal Konsept 2 — Dark Emerald Bento Canopy</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #091712; /* Derin Zümrüt Koyu Zemin (Siyah/Beyaz değil) */
      --card-bg: #10261f;
      --border: #1a3c31;
      --accent-emerald: #10b981;
      --accent-mint: #6ee7b7;
      --accent-amber: #f59e0b;
      --text: #f0fdf4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; padding: 36px; min-height: 100vh; }
    
    .brand { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; color: var(--accent-mint); margin-bottom: 32px; }
    
    /* Asimetrik Dev Bento Kanopisi */
    .bento-canopy { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: auto auto; gap: 20px; }
    
    .bento-hero {
      grid-column: span 1; grid-row: span 2;
      background: linear-gradient(145deg, #122b23, #0d201a);
      border: 1px solid var(--border); border-radius: 32px; padding: 40px;
      display: flex; flex-direction: column; justify-content: space-between;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .hero-val { font-family: 'Syne', sans-serif; font-size: 52px; font-weight: 800; color: var(--accent-mint); margin-top: 12px; }
    
    .bento-side {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 28px; padding: 28px; transition: transform 0.3s;
    }
    .bento-side:hover { transform: translateY(-4px); border-color: var(--accent-emerald); }
    .val { font-family: 'Syne', sans-serif; font-size: 30px; font-weight: 700; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="brand">AKGÜN // BENTO CANOPY</div>
  
  <div class="bento-canopy">
    <!-- Dev Hero Bento Kutusu -->
    <div class="bento-hero">
      <div>
        <span style="font-size: 13px; font-weight: 700; color: var(--accent-emerald); text-transform: uppercase; letter-spacing: 1px;">SİSTEM ANA BORÇ BAKİYESİ</span>
        <div class="hero-val">₺124.348.289</div>
      </div>
      <div style="background: rgba(16, 185, 129, 0.1); border: 1px solid var(--accent-emerald); padding: 16px 24px; border-radius: 20px; color: var(--accent-mint); font-weight: 600;">
        ➔ Vade yapısı stabil seviyede, yaşlandırma riski yok.
      </div>
    </div>

    <!-- Yan Bento Kutuları -->
    <div class="bento-side">
      <span style="font-size: 12px; color: #a7f3d0; font-weight: 700;">ORTALAMA VADE</span>
      <div class="val" style="color: var(--accent-mint);">24 GÜN</div>
    </div>

    <div class="bento-side">
      <span style="font-size: 12px; color: #a7f3d0; font-weight: 700;">ÇEK & SENET RİSKİ</span>
      <div class="val" style="color: var(--accent-amber);">₺20.7M</div>
    </div>
  </div>
</body>
</html>
