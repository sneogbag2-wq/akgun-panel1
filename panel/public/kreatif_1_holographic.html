<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kreatif 1 — Holographic Aurora Grid</title>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030014;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.12);
      --holo-1: #ff007f;
      --holo-2: #7f00ff;
      --holo-3: #00f0ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; padding: 40px; min-height: 100vh;
      overflow-x: hidden;
    }
    /* Holografik Işık Dalgası Animasyonu */
    .aurora-bg {
      position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle at 50% 50%, rgba(127,0,255,0.2) 0%, rgba(255,0,127,0.15) 30%, rgba(0,240,255,0.1) 60%, transparent 80%);
      filter: blur(80px); animation: rotateAurora 20s linear infinite; z-index: -1;
    }
    @keyframes rotateAurora { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .header { margin-bottom: 40px; }
    .hero-title { font-family: 'Syncopate', sans-serif; font-size: 36px; text-transform: uppercase; background: linear-gradient(90deg, #fff, var(--holo-3), var(--holo-1)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 4px; }
    
    .hologram-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
    .holo-card {
      background: var(--card-bg);
      backdrop-filter: blur(30px);
      border: 1px solid var(--border);
      border-radius: 24px; padding: 32px;
      position: relative;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .holo-card::after {
      content: ''; position: absolute; inset: -1px; border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,0,127,0.4), rgba(0,240,255,0.4));
      z-index: -1; opacity: 0.3; transition: opacity 0.4s;
    }
    .holo-card:hover {
      transform: translateY(-10px) rotateX(4deg);
      box-shadow: 0 20px 50px rgba(127, 0, 255, 0.4);
    }
    .holo-card:hover::after { opacity: 1; }

    .val { font-family: 'Syncopate', sans-serif; font-size: 28px; font-weight: 700; margin-top: 16px; background: linear-gradient(90deg, #fff, #cbd5e1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .spark { width: 100%; height: 4px; background: linear-gradient(90deg, var(--holo-1), var(--holo-3)); margin-top: 20px; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="aurora-bg"></div>
  <div class="header">
    <h1 class="hero-title">AKGÜN HOLOGRAPHIC HUB</h1>
    <p style="color: #94a3b8; margin-top: 8px;">Kreatif Konsept 1: Dinamik Holografik Aurora Işık Tarlası & Cam Küpler</p>
  </div>
  <div class="hologram-grid">
    <div class="holo-card">
      <span style="font-size: 12px; color: var(--holo-3); font-weight: 700; letter-spacing: 2px;">KALAN BORÇ BAKİYESİ</span>
      <div class="val">₺124.3M</div>
      <div class="spark"></div>
    </div>
    <div class="holo-card">
      <span style="font-size: 12px; color: #10b981; font-weight: 700; letter-spacing: 2px;">PORTFÖY VADESİ</span>
      <div class="val" style="background: linear-gradient(90deg, #10b981, #6ee7b7); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">24 GÜN</div>
      <div class="spark" style="background: #10b981;"></div>
    </div>
    <div class="holo-card">
      <span style="font-size: 12px; color: var(--holo-1); font-weight: 700; letter-spacing: 2px;">ÇEK / SENET RİSKİ</span>
      <div class="val" style="background: linear-gradient(90deg, var(--holo-1), #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">₺20.7M</div>
      <div class="spark" style="background: var(--holo-1);"></div>
    </div>
    <div class="holo-card">
      <span style="font-size: 12px; color: #a855f7; font-weight: 700; letter-spacing: 2px;">TAHSİLAT VERİMİ</span>
      <div class="val">%286.0</div>
      <div class="spark" style="background: #a855f7;"></div>
    </div>
  </div>
</body>
</html>
