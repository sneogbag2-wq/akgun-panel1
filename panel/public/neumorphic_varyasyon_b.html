<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neumorphic Varyasyon B — Dark Cyber-Tactile Skeuomorphism</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #12151c;
      --shadow-dark: #090a0e;
      --shadow-light: #1b202a;
      --neon-cyan: #00f0ff;
      --neon-amber: #f59e0b;
      --neon-red: #ef4444;
      --text: #f1f5f9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 36px; min-height: 100vh; }
    
    .header { margin-bottom: 32px; border-bottom: 2px solid var(--shadow-light); padding-bottom: 16px; }
    .title { font-size: 26px; font-weight: 800; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
    
    /* Yivli / Buton Tipi Neumorphic Kadran */
    .tactile-card {
      background: linear-gradient(145deg, #13171f, #101218);
      border-radius: 28px; padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      box-shadow: 10px 10px 24px var(--shadow-dark), -10px -10px 24px var(--shadow-light);
      position: relative;
    }
    
    /* Neon Gömülü Düğme Indicator */
    .dial-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--bg);
      box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
    }
    .dial-dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }

    .val { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; margin-top: 10px; }
    .progress-track {
      width: 100%; height: 8px; border-radius: 10px; margin-top: 18px;
      box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
      overflow: hidden;
    }
    .progress-fill { height: 100%; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">AKGÜN Neumorphic — Varyasyon B (Cyber-Tactile Kadran)</h1>
    <p style="color: #64748b; font-size: 14px; margin-top: 4px;">Siber-Dokunsal Fiziksel Kadranlar, Neon Gösterge Noktaları ve Gömülü İlerleme Kanalları</p>
  </div>

  <div class="grid">
    <div class="tactile-card">
      <div class="dial-btn"><div class="dial-dot" style="background: var(--neon-cyan); color: var(--neon-cyan);"></div></div>
      <div style="font-size: 12px; color: #94a3b8; font-weight: 700; letter-spacing: 1px;">KALAN BAKİYE</div>
      <div class="val" style="color: var(--neon-cyan);">₺124.348.289</div>
      <div class="progress-track"><div class="progress-fill" style="width: 70%; background: var(--neon-cyan);"></div></div>
    </div>

    <div class="tactile-card">
      <div class="dial-btn"><div class="dial-dot" style="background: #10b981; color: #10b981;"></div></div>
      <div style="font-size: 12px; color: #94a3b8; font-weight: 700; letter-spacing: 1px;">ORTALAMA VADE</div>
      <div class="val" style="color: #10b981;">24 GÜN</div>
      <div class="progress-track"><div class="progress-fill" style="width: 45%; background: #10b981;"></div></div>
    </div>

    <div class="tactile-card">
      <div class="dial-btn"><div class="dial-dot" style="background: var(--neon-red); color: var(--neon-red);"></div></div>
      <div style="font-size: 12px; color: #94a3b8; font-weight: 700; letter-spacing: 1px;">ÇEK / SENET RİSKİ</div>
      <div class="val" style="color: var(--neon-red);">₺20.791.707</div>
      <div class="progress-track"><div class="progress-fill" style="width: 85%; background: var(--neon-red);"></div></div>
    </div>

    <div class="tactile-card">
      <div class="dial-btn"><div class="dial-dot" style="background: #a855f7; color: #a855f7;"></div></div>
      <div style="font-size: 12px; color: #94a3b8; font-weight: 700; letter-spacing: 1px;">TAHSİLAT ORANI</div>
      <div class="val" style="color: #a855f7;">%286.0</div>
      <div class="progress-track"><div class="progress-fill" style="width: 95%; background: #a855f7;"></div></div>
    </div>
  </div>
</body>
</html>
